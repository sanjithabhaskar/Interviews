<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Helvetica, Arial, sans-serif">
  <title>LLM evaluation loop</title>
  <rect width="700" height="320" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Evaluation loop</text>
  <g font-size="13" text-anchor="middle" fill="#1f2937">
    <rect x="30" y="120" width="140" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="100" y="146">Golden dataset</text>
    <text x="100" y="164" font-size="11" fill="#374151">real traffic + edge cases</text>
    <rect x="210" y="120" width="140" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="280" y="146">Run system</text>
    <text x="280" y="164" font-size="11" fill="#312e81">prompt, model, tools</text>
    <rect x="390" y="120" width="140" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="460" y="146">Score</text>
    <text x="460" y="164" font-size="11" fill="#78350f">checks, judge, humans</text>
    <rect x="550" y="120" width="130" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="615" y="146">Decide</text>
    <text x="615" y="164" font-size="11" fill="#14532d">ship, block, or fix</text>
    <rect x="210" y="230" width="280" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="350" y="252">Production traces feed back</text>
    <text x="350" y="269" font-size="11" fill="#374151">failures become new test cases</text>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="170" y1="150" x2="210" y2="150"/>
    <line x1="350" y1="150" x2="390" y2="150"/>
    <line x1="530" y1="150" x2="550" y2="150"/>
    <path d="M 420 230 L 420 180 M 290 230 L 290 180"/>
    <path d="M 100 180 L 100 255 L 210 255" stroke-dasharray="4 3"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
