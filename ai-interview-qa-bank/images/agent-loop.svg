<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Helvetica, Arial, sans-serif">
  <title>Agent loop with tool calls and guardrails</title>
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Agent loop</text>
  <g font-size="13" text-anchor="middle" fill="#1f2937">
    <rect x="40" y="150" width="160" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="120" y="176">LLM</text>
    <text x="120" y="194" font-size="11" fill="#312e81">plans the next step</text>
    <rect x="260" y="150" width="160" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="340" y="176">Guardrail check</text>
    <text x="340" y="194" font-size="11" fill="#78350f">schema, permissions, budget</text>
    <rect x="480" y="150" width="160" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="560" y="176">Tool executes</text>
    <text x="560" y="194" font-size="11" fill="#14532d">returns structured result</text>
    <rect x="260" y="290" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="340" y="312">Observation</text>
    <text x="340" y="329" font-size="11" fill="#374151">appended to context</text>
    <rect x="40" y="60" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="120" y="82">Final answer</text>
    <text x="120" y="99" font-size="11" fill="#374151">when no tool is needed</text>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="200" y1="180" x2="260" y2="180"/>
    <line x1="420" y1="180" x2="480" y2="180"/>
    <path d="M 560 210 L 560 265 L 420 315"/>
    <path d="M 260 315 L 200 265 L 120 210"/>
    <line x1="120" y1="150" x2="120" y2="110" stroke-dasharray="4 3"/>
  </g>
  <text x="620" y="260" font-size="11" fill="#6b7280" text-anchor="end">loop until done or budget hit</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
