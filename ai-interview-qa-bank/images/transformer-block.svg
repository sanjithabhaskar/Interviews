<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Helvetica, Arial, sans-serif">
  <title>Decoder-only transformer block</title>
  <rect width="640" height="520" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">One decoder block (repeated N times)</text>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <rect x="200" y="440" width="240" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="320" y="465">Token embeddings + position</text>
    <rect x="200" y="360" width="240" height="50" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="320" y="382">Masked multi-head self-attention</text>
    <text x="320" y="399" font-size="11" fill="#78350f">Q, K, V projections, causal mask</text>
    <rect x="200" y="290" width="240" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="320" y="315">LayerNorm, then residual add</text>
    <rect x="200" y="220" width="240" height="50" rx="6" fill="#dcfce7" stroke="#15803d"/>
    <text x="320" y="242">Feed-forward network (MLP)</text>
    <text x="320" y="259" font-size="11" fill="#14532d">Usually the bulk of parameters</text>
    <rect x="200" y="150" width="240" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="320" y="175">LayerNorm, then residual add</text>
    <rect x="200" y="60" width="240" height="50" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="320" y="82">Output projection to vocabulary</text>
    <text x="320" y="99" font-size="11" fill="#312e81">Softmax gives next-token probabilities</text>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="320" y1="440" x2="320" y2="412"/>
    <line x1="320" y1="360" x2="320" y2="332"/>
    <line x1="320" y1="290" x2="320" y2="272"/>
    <line x1="320" y1="220" x2="320" y2="192"/>
    <line x1="320" y1="150" x2="320" y2="112"/>
  </g>
  <path d="M 470 480 L 500 480 L 500 310 L 470 310" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <path d="M 470 310 L 500 310" stroke="none"/>
  <text x="515" y="400" font-size="11" fill="#6b7280" transform="rotate(90 515 400)">residual stream</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
