<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
  <title>LLM serving architecture</title>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">LLM serving stack</text>
  <g font-size="13" text-anchor="middle" fill="#1f2937">
    <rect x="20" y="150" width="120" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="80" y="176">Clients</text>
    <text x="80" y="194" font-size="11" fill="#374151">apps, agents, users</text>
    <rect x="180" y="150" width="130" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="245" y="176">Gateway</text>
    <text x="245" y="194" font-size="11" fill="#312e81">auth, quotas, routing</text>
    <rect x="350" y="150" width="150" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="425" y="176">Inference server</text>
    <text x="425" y="194" font-size="11" fill="#78350f">continuous batching</text>
    <rect x="540" y="80" width="160" height="50" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="620" y="103">GPU memory</text>
    <text x="620" y="120" font-size="11" fill="#14532d">weights + KV cache</text>
    <rect x="540" y="220" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="620" y="243">Cache and fallback</text>
    <text x="620" y="260" font-size="11" fill="#374151">prompt cache, smaller model</text>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="140" y1="180" x2="180" y2="180"/>
    <line x1="310" y1="180" x2="350" y2="180"/>
    <line x1="500" y1="170" x2="540" y2="115"/>
    <line x1="500" y1="190" x2="540" y2="235"/>
  </g>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#374151">Key metrics: time to first token, inter-token latency, tokens per second, cost per 1M tokens</text>
  <text x="360" y="322" text-anchor="middle" font-size="12" fill="#374151">Knobs: quantization, batch size, max context, speculative decoding, tensor parallelism</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
