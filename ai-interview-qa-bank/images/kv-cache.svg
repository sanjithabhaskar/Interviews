<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Helvetica, Arial, sans-serif">
  <title>KV cache during autoregressive decoding</title>
  <rect width="700" height="300" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">KV cache: store keys and values once, reuse every step</text>
  <g font-size="12" text-anchor="middle" fill="#1f2937">
    <text x="60" y="70" font-weight="bold">Step 1</text>
    <rect x="110" y="55" width="110" height="28" rx="4" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="165" y="74">The</text>
    <text x="60" y="110" font-weight="bold">Step 2</text>
    <rect x="110" y="95" width="110" height="28" rx="4" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="165" y="114">The</text>
    <rect x="225" y="95" width="110" height="28" rx="4" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="280" y="114">cat</text>
    <text x="60" y="150" font-weight="bold">Step 3</text>
    <rect x="110" y="135" width="110" height="28" rx="4" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="165" y="154">The</text>
    <rect x="225" y="135" width="110" height="28" rx="4" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="280" y="154">cat</text>
    <rect x="340" y="135" width="110" height="28" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="395" y="154">sat</text>
  </g>
  <rect x="470" y="60" width="200" height="110" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="570" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">KV cache</text>
  <text x="570" y="110" text-anchor="middle" font-size="12" fill="#78350f">keys and values for</text>
  <text x="570" y="128" text-anchor="middle" font-size="12" fill="#78350f">past tokens, per layer</text>
  <text x="570" y="152" text-anchor="middle" font-size="11" fill="#78350f">grows with sequence length</text>
  <text x="350" y="220" text-anchor="middle" font-size="12" fill="#374151">Each new step computes K and V only for the new token,</text>
  <text x="350" y="240" text-anchor="middle" font-size="12" fill="#374151">then attends over the cached K and V. This trades memory for compute.</text>
  <text x="350" y="270" text-anchor="middle" font-size="11" fill="#6b7280">Memory ~ 2 x layers x kv_heads x head_dim x seq_len x bytes per value</text>
</svg>
